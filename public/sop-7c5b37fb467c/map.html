<style>
  :root { --bg:#f7f7f5; --ink:#1d1d1f; --muted:#6b6b70; --line:#c9c9cf; }

  header { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; background:#fff; border-bottom:1px solid #e5e5e8; z-index:5; }

  svg { width:100%; height:100%; display:block; }
  .link { fill:none; stroke:var(--line); stroke-width:1.6; }
  .node { cursor:pointer; }
  .card { width:100%; height:100%; border-radius:12px; padding:7px 10px; background:#fff; border:1.5px solid #dcdce2; display:flex; flex-direction:column; justify-content:center; overflow:hidden; transition:box-shadow .15s; }
  .card:hover { box-shadow:0 4px 14px rgba(0,0,0,.10); }
  .card.sel { box-shadow:0 0 0 3px rgba(0,0,0,.18); }
  .card .t { font-size:13px; font-weight:650; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .s { font-size:11px; color:var(--muted); line-height:1.25; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .badge { font-size:10.5px; font-weight:700; margin-left:6px; opacity:.7; }
  .card.root { color:#fff; border:none; }
  .card.root .s { color:rgba(255,255,255,.85); }
  aside { position:fixed; top:52px; right:0; width:380px; bottom:0; background:#fff; border-left:1px solid #e5e5e8; overflow:auto; padding:18px 20px 40px; }
  aside h2 { font-size:18px; margin:4px 0 4px; }
  aside .sum { color:var(--muted); font-size:13px; margin-bottom:14px; }
  aside h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  aside p, aside li { font-size:13.5px; line-height:1.5; }
  aside ul { padding-left:18px; margin:4px 0; }
  aside .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; background:#f0f0f3; margin:2px 4px 2px 0; }
  aside .crumbs { font-size:11.5px; color:var(--muted); }
  aside .crumbs a { color:var(--muted); cursor:pointer; text-decoration:underline; }
  @media (max-width: 1000px) {
    header { height:auto; min-height:52px; flex-wrap:wrap; padding:8px 12px; }
    header .hint { display:none; }
    #stage { top:52px; right:0; bottom:42vh; }
    aside { top:auto; height:42vh; width:auto; left:0; border-left:none; border-top:1px solid #e5e5e8; }
  }
  aside .viz { background:#fafafa; border:1px solid #ececf0; border-radius:12px; padding:8px; margin:6px 0 4px; }
  aside .viz svg { width:100%; height:auto; display:block; font-family:inherit; }

    why:"So we never guess. We build only what buyers already ask for, in their words, skip what we can't win, and keep only what the numbers prove.",

        ]},

    s+=T((x(0)+x(30))/2,50,"FOLD",{w:700,c:C.red})+T((x(30)+x(70))/2,50,"ENRICH",{w:700,c:"#b45309"})+T((x(70)+x(100))/2,50,"SCALE",{w:700,c:C.bofu});
    [0,30,70,100].forEach(p=>s+=T(x(p),78,p+"%",{fs:10,c:C.mute}));
    return s+T(170,18,"at 30 days: % of pilot pages indexed with impressions",{fs:10,w:600})+T(170,104,"pilot = one cluster or 50–100 pages · per cluster",{fs:9,c:C.mute})+`</svg>`;

    s+=T(320,62,"↓",{c:C.mute});
    s+=`<rect x="91" y="128" width="155" height="30" rx="7" fill="#fee2e2"/>`+T(168,147,"fail → BLOCKED (never noindex after)",{fs:9,c:C.red,w:600});
    return s+`</svg>`;
  },
  topicCard(){
    const r=[["signal","Reddit thread ranks #1"],["phrase → keyword","dry cleaners kharghar"],["volume · gap","~40/mo · ✅ capture"],["score","high (BOFU, main service)"],["cluster · tag","dry cleaning · BOFU"],["offer · channel","pickup quote · page + reel"],["status","idea → approved → built → live → judged"]];
    let s=`<svg viewBox="0 0 340 215" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="6" width="324" height="204" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>`+T(20,26,"📇 TOPIC CARD (example, laundry)",{a:"start",w:700,c:"#0891b2"});
    r.forEach(([k,v],i)=>{s+=T(20,50+i*23,k,{a:"start",fs:9.5,c:C.mute})+T(130,50+i*23,v,{a:"start",fs:10});});
    return s+`</svg>`;
  },
  machine(){
    const ph=[["👂","Listen","#4f46e5"],["🧭","Decide","#0891b2"],["🏗️","Build","#16a34a"],["▶️","Run","#d97706"],["📈","Scale","#db2777"]];
    let s=`<svg viewBox="0 0 340 250" xmlns="http://www.w3.org/2000/svg"><circle cx="170" cy="125" r="82" fill="none" stroke="${C.line}" stroke-width="2" stroke-dasharray="5 4"/>`;
    ph.forEach(([e,t,c],i)=>{const a=-Math.PI/2+i*2*Math.PI/5,x=170+82*Math.cos(a),y=125+82*Math.sin(a); s+=`<circle cx="${x}" cy="${y}" r="30" fill="${c}"/>`+T(x,y-2,e,{fs:14})+T(x,y+14,t,{c:"#fff",w:700,fs:10});});
    return s+T(170,121,"one topic",{w:700})+T(170,136,"at a time",{fs:10,c:C.mute})+`</svg>`;
  },
  listen3(){
    let s=`<svg viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">`;
    [[125,90,"#4f46e5","🌐 Market","online + offline"],[215,90,"#d97706","🏪 Client","data + voice"],[170,160,"#dc2626","🥊 Competitors","publish · reviews · strength"]].forEach(([x,y,c,t,d])=>{s+=`<circle cx="${x}" cy="${y}" r="62" fill="${c}" fill-opacity=".12" stroke="${c}"/>`;});
    s+=T(95,70,"🌐 Market",{w:700})+T(95,84,"online + offline",{fs:9,c:C.mute})+T(245,70,"🏪 Client",{w:700})+T(245,84,"data + voice",{fs:9,c:C.mute})+T(170,200,"🥊 Competitors",{w:700})+T(170,214,"publish · reviews · strength",{fs:9,c:C.mute});
    return s+T(170,118,"signals",{w:700,fs:12})+`</svg>`;
  },
  links(){
    let s=`<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${C.mute}"/></marker></defs>`;
    s+=`<rect x="125" y="10" width="90" height="34" rx="8" fill="${C.bofu}"/>`+T(170,31,"PILLAR",{c:"#fff",w:700});
    [[40,"spoke A"],[140,"spoke B"],[240,"spoke C"]].forEach(([x,t])=>{s+=`<rect x="${x}" y="100" width="70" height="30" rx="7" fill="#fff" stroke="${C.line}"/>`+T(x+35,119,t,{fs:10})+`<line x1="${x+35}" y1="100" x2="170" y2="44" stroke="${C.ink}" stroke-width="1.5" marker-end="url(#a2)"/>`;});
    s+=`<line x1="110" y1="115" x2="140" y2="115" stroke="${C.mute}" stroke-dasharray="3 2"/><line x1="210" y1="115" x2="240" y2="115" stroke="${C.mute}" stroke-dasharray="3 2"/>`;
    s+=`<rect x="10" y="160" width="110" height="30" rx="7" fill="#fef3c7"/>`+T(65,179,"page that earns traffic",{fs:9})+`<path d="M120,170 C200,170 260,150 270,132" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#a2)"/>`+T(250,180,"island bridge → money page",{fs:9,c:"#b45309"});
    return s+T(60,80,"in-body links",{fs:9,c:C.mute})+T(280,80,"siblings - - -",{fs:9,c:C.mute})+`</svg>`;
  },
  anatomy(){
    const b=[["H1 = slug = title",24,"#e0e7ff"],["40–60 word answer (TLDR)",22,"#dcfce7"],["unique block (real number, photo, local fact)",30,"#fef3c7"],["honest comparison block",26,"#f1f5f9"],["4–6 FAQs",22,"#f1f5f9"],["one coded CTA (WhatsApp)",22,"#dcfce7"],["5–10 related links + breadcrumbs",20,"#f1f5f9"]];
    let s=`<svg viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="4" width="220" height="222" rx="10" fill="#fff" stroke="${C.line}"/>`; let y=12;
    b.forEach(([t,h,f])=>{s+=`<rect x="70" y="${y}" width="200" height="${h}" rx="5" fill="${f}"/>`+T(170,y+h/2+4,t,{fs:9.5}); y+=h+5;});
    return s+`</svg>`;
  },
  capture(){
    const st=[["coded button / call","#e0f2fe"],["“how did you hear?”","#f1f5f9"],["AI qualifies","#e0e7ff"],["follow up day 2 + 7","#fef3c7"],["human closes","#dcfce7"],["hand-off + source","#dcfce7"]];
    let s=`<svg viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">`;
    st.forEach(([t,f],i)=>{const y=6+i*37; s+=`<rect x="70" y="${y}" width="200" height="28" rx="7" fill="${f}"/>`+T(170,y+18,t,{fs:10,w:600}); if(i<5) s+=T(170,y+36,"↓",{fs:10,c:C.mute});});
    return s+T(300,120,"🤖",{fs:14})+T(40,190,"🧑",{fs:14})+`</svg>`;
  },
  loops(){
    let s=`<svg viewBox="0 0 340 170" xmlns="http://www.w3.org/2000/svg">`;
    [[90,"📡 signals loop","→ Listen","#4f46e5"],[250,"🧠 learning loop","→ learnings doc + DB","#db2777"]].forEach(([x,t,d,c])=>{s+=`<circle cx="${x}" cy="80" r="58" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="230 30"/>`+T(x,76,t,{w:700,fs:10.5})+T(x,92,d,{fs:9,c:C.mute});});
    return s+T(170,160,"every round feeds the next one",{fs:9.5,c:C.mute})+`</svg>`;
  }
};

</script>

<script>
/* ======================= renderer (no need to edit) ======================= */
const W = 236, H = 58, GX = 300, GY = 14;
let uid = 0;
(function prep(n, depth, parent, color){
  n.id = uid++; n.depth = depth; n.parent = parent; n.color = n.c || color || '#1d1d1f';
  n.open = depth < 1;
  (n.kids||[]).forEach(k => prep(k, depth+1, n, n.depth===0 ? (k.c) : n.color));
})(DATA, 0, null, null);

const svg = document.getElementById('svg'), vp = document.getElementById('vp');
const gL = document.getElementById('links'), gN = document.getElementById('nodes');
let view = {x:40, y:0, k:1}, selected = DATA;

function layout(){
  let row = 0; const list = [];
  (function walk(n){
    list.push(n);
    const kids = n.open ? (n.kids||[]) : [];
    if (!kids.length){ n.y = row * (H + GY); row++; }
    else { kids.forEach(walk); n.y = (kids[0].y + kids[kids.length-1].y) / 2; }
    n.x = n.depth * GX;
  })(DATA);
  return list;
}
function tint(hex, a){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${a})`; }

function render(){
  const list = layout();
  gL.innerHTML = ''; gN.innerHTML = '';
  list.forEach(n => {
    if (n.parent){
      const p = n.parent, x1 = p.x + W, y1 = p.y + H/2, x2 = n.x, y2 = n.y + H/2, mx = (x1+x2)/2;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      path.setAttribute('class','link'); path.style.stroke = tint(n.color, .45);
      gL.appendChild(path);
    }
    const fo = document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
    fo.setAttribute('x', n.x); fo.setAttribute('y', n.y); fo.setAttribute('width', W); fo.setAttribute('height', H);
    fo.setAttribute('class','node');
    const kids = (n.kids||[]).length;
    const isRoot = n.depth === 0, isPhase = n.depth === 1;
    const bg = isRoot || isPhase ? n.color : tint(n.color, .07);
    const style = isRoot || isPhase ? `background:${bg};color:#fff;border:none` : `background:${bg};border-color:${tint(n.color,.45)}`;
    fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="card ${isRoot||isPhase?'root':''} ${n===selected?'sel':''}" style="${style}">
      <div class="t">${n.emoji||''} ${n.label}${(typeof VIZ_FOR!=='undefined'&&VIZ_FOR[n.label])?' 🖼️':''}${kids?`<span class="badge">${n.open?'−':'+'+kids}</span>`:''}</div>
      <div class="s">${n.sum||''}</div></div>`;
    fo.addEventListener('click', e => { e.stopPropagation(); if (kids) n.open = !n.open; selected = n; render(); showPanel(n); if (kids) fit(); });
    gN.appendChild(fo);
  });
  apply();
}
function apply(){ vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function showPanel(n){
  const d = n.d || {}, crumbs = [];
  for (let p = n.parent; p; p = p.parent) crumbs.unshift(p);
  const sec = (t, v) => v ? `<h3>${t}</h3>${Array.isArray(v) ? '<ul>'+v.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>' : `<p>${esc(v)}</p>`}` : '';
  document.getElementById('panel').innerHTML = `
    <div class="crumbs">${crumbs.map(c=>`<a onclick="goto(${c.id})">${esc(c.label)}</a>`).join(' › ')}</div>
    <h2 style="color:${n.color}">${n.emoji||''} ${esc(n.label)}</h2>
    <div class="sum">${esc(n.sum||'')}</div>
    ${(typeof VIZ_FOR!=='undefined'&&VIZ_FOR[n.label]&&VIZ[VIZ_FOR[n.label]])?`<div class="viz">${VIZ[VIZ_FOR[n.label]]()}</div>`:''}
    ${d.status?`<p><span class="pill" style="background:#fee2e2">${esc(d.status)}</span></p>`:''}${sec('What it is', d.what)}${sec('Why we do it', d.why)}${sec('How', d.how)}${sec('Example', d.eg)}
    ${sec('Who does it', d.who)}${sec('What it produces', d.out)}${sec('Proof', d.proof)}${sec('Guardrail / lesson', d.guard)}
    ${(n.kids||[]).length ? `<h3>Inside</h3>${n.kids.map(k=>`<span class="pill" style="cursor:pointer" onclick="goto(${k.id})">${k.emoji||''} ${esc(k.label)}</span>`).join('')}` : ''}`;
}
function all(n, f){ f(n); (n.kids||[]).forEach(k => all(k, f)); }
function goto(id){ all(DATA, n => { if (n.id === id){ selected = n; for (let p = n.parent; p; p = p.parent) p.open = true; } }); render(); showPanel(selected); }
function expandAll(){ all(DATA, n => n.open = true); render(); fit(); }
function collapseTo(level){ all(DATA, n => n.open = n.depth < level); render(); fit(); }
function fit(){
  const b = vp.getBBox(), r = svg.getBoundingClientRect();
  const k = Math.min(1.2, Math.min((r.width-60)/b.width, (r.height-60)/b.height));
  view.k = k; view.x = (r.width - b.width*k)/2 - b.x*k; view.y = (r.height - b.height*k)/2 - b.y*k; apply();
}
let drag = null; const stage = document.getElementById('stage');
stage.addEventListener('mousedown', e => { drag = {x:e.clientX - view.x, y:e.clientY - view.y}; stage.classList.add('drag'); });
window.addEventListener('mousemove', e => { if (drag){ view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply(); } });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('drag'); });
stage.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k2 = Math.max(.25, Math.min(2.5, view.k * (e.deltaY < 0 ? 1.1 : 0.9)));
  view.x = mx - (mx - view.x) * k2 / view.k; view.y = my - (my - view.y) * k2 / view.k; view.k = k2; apply(); }, {passive:false});

all(DATA, n => n.open = n.depth < 1); render(); showPanel(DATA);
requestAnimationFrame(fit); window.addEventListener('resize', fit);
</script>
